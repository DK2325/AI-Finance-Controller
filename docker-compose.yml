# Project name is pinned because the folder is "AI Finance Controller" -- Compose would
# otherwise derive an illegal project name from it (spaces, capitals) and refuse to start.
name: ledgerloop

# TWO SERVICES, NOT THREE, AND ONE IMAGE SHARED WITH THE HOSTED DEPLOYMENT.
#
# This file used to build a separate `api` image from docker/api.Dockerfile and a `web`
# container from web/server.js. That is a deviation from BUILD.md's three-service layout
# and it is recorded there, because the reason is a defect this arrangement caused.
#
# Keeping two Dockerfiles meant keeping them in sync by hand, and they drifted the moment
# the hosted one was fixed and this one was not. A cold `docker compose up` from a fresh
# clone failed outright -- and it failed in three separate ways at once:
#
#   1. web/server.js was added to .dockerignore for the hosted image, so the web container
#      could not build at all.
#   2. docker/api.Dockerfile copied no runs/, data/ or web/static, so the dashboard would
#      have been empty even if it had started.
#   3. docker/api.Dockerfile installed no libgomp1, so any model load would raise the same
#      OSError that broke the deployed demo batch.
#
# All three existed because the deployed path was exercised daily and the documented one
# was not. The fix is not to sync them more carefully; it is to have one image, so local
# and hosted are the same artifact running the same code, and drift has nowhere to live.
#
# The API serves the static frontend, so the third container is redundant.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerloop}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerloop}
    healthcheck:
      # api waits on this. Without it, the api container races Postgres and dies on a
      # reviewer's cold machine -- the single most common cause of a failed compose up.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerloop} -d ${POSTGRES_DB:-ledgerloop}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  app:
    # The same Dockerfile the hosted deployment builds. One image, two run modes.
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ledgerloop}:${POSTGRES_PASSWORD:-ledgerloop}@db:5432/${POSTGRES_DB:-ledgerloop}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      PORT: 8000
    # No entrypoint override. Migrations used to run in a shell script that only this
    # path invoked; the hosted deployment ran the image's CMD and never applied them, and
    # the divergence was invisible because compose was the path being tested. The
    # application applies them on start now, so both paths get the schema by running the
    # same image rather than by two files agreeing.
    ports:
      # 3000 as well as 8000, because BUILD.md and the README both say 3000 and a reviewer
      # who typed that should not meet a dead port.
      - "8000:8000"
      - "3000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  # Named volume, so "docker compose down" does not destroy the database.
  pgdata:
