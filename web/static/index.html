<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LedgerLoop — reconciliation that knows when it is wrong</title>
<link rel="preload" href="/assets/fonts/newsreader-latin.woff2" as="font"
      type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font"
      type="font/woff2" crossorigin>
<meta name="description"
      content="LedgerLoop reconciles payment settlements against bank credits and invoices,
               and routes what it cannot decide to a human with the evidence attached.">
<meta name="theme-color" content="#191b21">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%23191b21'/%3E%3Cpath%20d='M11%209v14h10'%20fill='none'%20stroke='%23c8a96a'%20stroke-width='3'%20stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<a class="skip" href="#app">Skip to the run</a>

<div class="shell">

  <aside class="rail">
    <div class="brand">
      <h1>Ledger<span>Loop</span></h1>
      <p class="tagline">Reconciliation that knows when it is wrong.</p>
    </div>

    <nav class="nav" aria-label="Screens">
      <span class="nav-ink" id="nav-ink" aria-hidden="true"></span>
      <button type="button" class="tab" data-screen="dashboard" aria-current="true">
        <span class="nav-key">01</span>Dashboard
      </button>
      <button type="button" class="tab" data-screen="review">
        <span class="nav-key">02</span>Review queue
      </button>
      <button type="button" class="tab" data-screen="upload">
        <span class="nav-key">03</span>Run a batch
      </button>
      <button type="button" class="tab" data-screen="chaos">
        <span class="nav-key">04</span>Chaos
      </button>
    </nav>

    <div class="rail-foot">
      <p class="rail-links">
        <a href="/api/runs" target="_blank" rel="noopener">API</a>
        <a href="/health" target="_blank" rel="noopener">health</a>
      </p>
    </div>
  </aside>

  <div class="content">
    <header class="bar">
      <div class="bar-inner wrap">
        <p class="crumb" id="crumb">Dashboard</p>
        <div class="badges" id="badges"></div>
      </div>
    </header>

    <main class="wrap" id="app">
      <p class="loading">Loading run…</p>
    </main>

    <footer class="colophon">
      <div class="wrap"><span id="foot-run">—</span></div>
    </footer>
  </div>

</div>

<template id="review-template">
  <section class="panel">
    <div class="panel-head">
      <div class="head-title">
        <p class="eyebrow">Evidence</p>
        <h2>Review queue</h2>
      </div>
      <div class="head-note">
        <p class="sub">
          Every exception, with the rows the decision was made from. Nothing here is
          summarised — resolving one means comparing an amount against an amount and a name
          against a narration, and a summary removes the detail that does it.
        </p>
      </div>
    </div>

    <div class="filters">
      <label>Reason
        <select id="filter-code"><option value="">all codes</option></select>
      </label>
      <span class="filter-count" id="filter-count">—</span>
    </div>

    <div class="queue">
      <ul class="ex-list" id="ex-list"></ul>
      <div class="ex-detail" id="ex-detail">
        <p class="empty">Select an exception to see its evidence.</p>
      </div>
    </div>
  </section>
</template>

<template id="upload-template">
  <section class="panel">
    <div class="panel-head">
      <div class="head-title">
        <p class="eyebrow">Batch</p>
        <h2>Run a batch</h2>
      </div>
      <div class="head-note">
        <p class="sub">
          The demo batch is one click and needs no files. Uploading your own runs the same
          pipeline — but an uploaded batch has no answer key, so the system reports what it
          decided and declines to claim accuracy it cannot measure.
        </p>
      </div>
    </div>

    <div class="demo-cta">
      <button type="button" class="primary" id="run-demo">Run the demo batch</button>
      <span class="hint">495 settlements · no files needed · finishes in seconds</span>
    </div>

    <div class="upload-grid">
      <label class="drop">
        <span class="drop-title">Gateway settlements</span>
        <span class="drop-sub">gateway_settlements.csv</span>
        <input type="file" accept=".csv" id="f-gateway">
      </label>
      <label class="drop">
        <span class="drop-title">Bank statement</span>
        <span class="drop-sub">bank_statement.csv</span>
        <input type="file" accept=".csv" id="f-bank">
      </label>
      <label class="drop">
        <span class="drop-title">Invoice ledger</span>
        <span class="drop-sub">invoice_ledger.csv</span>
        <input type="file" accept=".csv" id="f-invoices">
      </label>
    </div>

    <button type="button" class="primary ghost" id="run-upload" disabled>
      Upload and reconcile
    </button>

    <div class="job" id="job" hidden>
      <div class="job-step" id="job-step">—</div>
      <div class="job-bar"><div class="job-fill" id="job-fill"></div></div>
      <div class="job-note" id="job-note"></div>
    </div>
  </section>
</template>

<template id="explorer-template">
  <div class="heldout" id="heldout" hidden>
    <strong>These are held-out numbers.</strong>
    <span id="heldout-detail"></span>
  </div>

  <section class="panel">
    <div class="panel-head">
      <div class="head-title">
        <p class="eyebrow">01 &mdash; Operating point</p>
        <h2>Choose the operating point</h2>
      </div>
      <div class="head-note">
        <p class="sub">
          The system does not choose how much risk you take. You do — and every choice
          below is one it can actually reach.
        </p>
      </div>
    </div>

    <div class="chosen">
      <div class="chosen-figure">
        <span class="big" data-bind="coverage">—</span>
        <span class="label">auto-matched</span>
      </div>
      <div class="chosen-detail">
        <strong data-bind="matched">—</strong> of <span data-bind="settlements">—</span>
        settlements matched automatically ·
        <strong data-bind="to_review">—</strong> go to a human
      </div>
      <div class="chosen-point">
        <span class="chosen-point-v" data-bind="threshold">—</span>
        <span class="label">calibrated threshold</span>
      </div>
    </div>

    <div class="track-wrap">
      <p class="track-note above">
        <strong>These are the only points that exist</strong> — click or use ← → to move
        between them. The gaps are drawn to scale: <em>width is the number of settlements
        that step admits</em>. Isotonic calibration produces a step function, so the jumps
        are real and wildly uneven, and a smooth slider would imply a resolution the model
        does not have.
      </p>
      <div class="track" id="track" role="group" aria-label="Operating points"></div>
      <p class="track-foot" id="track-foot"></p>
    </div>

    <div class="consequences">
      <article class="cons" data-dir="down">
        <h3>Review workload</h3>
        <div class="cons-value" data-bind="to_review_v">—</div>
        <div class="cons-unit">exceptions for a human</div>
        <svg class="spark" data-spark="to_review" viewBox="0 0 200 44" preserveAspectRatio="none"></svg>
        <div class="cons-trend">falls as you automate more</div>
      </article>

      <article class="cons alarm" data-dir="up">
        <h3>Wrong money</h3>
        <div class="cons-value" data-bind="wrong_money_v">—</div>
        <div class="cons-unit">
          mis-posted, of <span data-bind="total_money">—</span> at stake
        </div>
        <svg class="spark" data-spark="wrong_money_paise" viewBox="0 0 200 44" preserveAspectRatio="none"></svg>
        <div class="cons-trend">rises as you automate more</div>
      </article>

      <article class="cons" data-dir="down">
        <h3>Inference cost</h3>
        <div class="cons-value" data-bind="cost_v">—</div>
        <div class="cons-unit">per run, priced as a range</div>
        <svg class="spark" data-spark="cost_low_inr" viewBox="0 0 200 44" preserveAspectRatio="none"></svg>
        <div class="cons-trend">falls — fewer exceptions to explain</div>
      </article>
    </div>

    <p class="divergence">
      <strong>They pull against each other.</strong> Automate more and you buy back review
      time and inference cost — and you pay for it in money posted to the wrong invoice.
      No single number can express that trade, which is why the merchant makes the call
      rather than the system.
    </p>

    <div class="precision">
      <div class="precision-head">
        <h3>Precision on what it auto-matched</h3>
        <div class="precision-value">
          <span data-bind="precision">—</span>
          <span class="ci" data-bind="ci">—</span>
        </div>
      </div>
      <div class="precision-bar">
        <div class="precision-floor" title="99.5% precision floor"></div>
        <div class="precision-interval" id="ci-bar"></div>
      </div>
      <p class="precision-note" data-bind="precision_note">—</p>
    </div>

    <div class="warn" id="cliff" hidden>
      <strong>This point is past the floor.</strong>
      <span data-bind="cliff_text">—</span>
      It is shown because a slider that stops at the last good point hides the reason the
      floor exists.
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div class="head-title">
        <p class="eyebrow">02 &mdash; Exceptions</p>
        <h2>What it could not resolve</h2>

        <div class="split" id="reason-split" hidden>
          <div class="split-bar">
            <span class="split-free" id="split-free"></span>
            <span class="split-llm" id="split-llm"></span>
          </div>
          <div class="split-legend">
            <span class="split-key free">
              <i></i>no model call · <strong id="split-free-n">&mdash;</strong>
            </span>
            <span class="split-key llm">
              <i></i>explained by model · <strong id="split-llm-n">&mdash;</strong>
            </span>
          </div>
        </div>
      </div>
      <div class="head-note">
        <p class="sub">
          Every settlement is accounted for exactly once — matched, or an exception with a
          reason. <strong><span data-bind="free_share">—</span> of exceptions are settled
          with no model call.</strong>
        </p>
        <p class="sub batch-note">
          That share is a property of <em>this batch</em>, not a fixed capability. How many
          payouts have no candidate credit at all depends on the data, so a batch where more
          money simply has not arrived settles a larger share deterministically. Both figures
          are real; neither is the system's score.
        </p>
      </div>
    </div>
    <ul class="reasons" id="reasons"></ul>
  </section>
</template>

<template id="chaos-template">
  <section class="panel">
    <div class="panel-head">
      <div class="head-title">
        <p class="eyebrow">Adversarial</p>
        <h2>Break it on purpose</h2>
      </div>
      <div class="head-note">
        <p class="sub">
          Name a corruption this system was never built for. It is injected into the bank
          statement, and the batch is reconciled twice — clean and corrupted — against the
          same answer key.
        </p>
        <p class="sub batch-note">
          <strong>A graceful failure is the pass condition.</strong> Coverage collapsing
          while precision holds is the system working: it routed what it did not understand
          to a human instead of guessing. Coverage holding while precision collapses is the
          only outcome that matters, because that is money posted against the wrong invoice
          with no warning.
        </p>
      </div>
    </div>

    <div class="chaos-input">
      <input id="chaos-text" type="text"
             placeholder="e.g. a bank that reports dates a day early"
             aria-label="Describe a corruption">
      <button type="button" class="primary" id="chaos-run">Inject it</button>
    </div>
    <div class="chips" id="chaos-chips"></div>
    <p class="hint" id="chaos-hint">
      Typed in plain English. A deterministic keyword mapping is tried first and answers
      almost everything; the model is consulted only when it finds nothing. The result says
      which one answered.
    </p>

    <div class="job" id="job" hidden>
      <div class="job-step" id="job-step">—</div>
      <div class="job-bar"><div class="job-fill" id="job-fill"></div></div>
      <div class="job-note" id="job-note"></div>
    </div>

    <div id="chaos-result" hidden></div>
  </section>
</template>

<script src="/assets/app.js"></script>
</body>
</html>
