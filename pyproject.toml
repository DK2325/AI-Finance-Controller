[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerloop"
version = "0.1.0"
description = "Reconciliation system that knows when it is wrong"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "polars>=1.0",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "lightgbm>=4.4",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "openai>=1.40",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
ledgerloop = "ledgerloop.cli:app"

[tool.setuptools]
packages = ["ledgerloop", "datagen", "core", "model", "llm", "api", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["venv", ".venv", "web", "ledgerloop/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) in an argument default is Typer's documented idiom, not the mutable
# default B008 exists to catch. Scoped to the CLI so the rule stays live everywhere else.
"ledgerloop/cli.py" = ["B008"]

[tool.ruff.lint.isort]
# `astutil` is a test-local helper, not a third-party package. Without this, ruff sorts
# it into the third-party block and then reports the result as unsorted.
known-first-party = ["astutil", "datagen", "core", "model", "llm", "api", "evals", "ledgerloop"]
